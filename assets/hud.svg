<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 64" width="880" height="64" role="img" aria-label="Status strip: pipeline active. Stack: rust, typescript, bwrap, sandbox-exec. Policy: fail-closed, offline, no keys.">
  <defs>
    <linearGradient id="hbg" x1="0" y1="0" x2="1" y2="0">
      <stop id="h1" offset="0"/>
      <stop id="h2" offset="1"/>
    </linearGradient>
    <style>
      :root {
        --bg0: #0a0f14; --bg1: #101a22; --line: #1c2a33;
        --tx: #e6f1f5; --dim: #6b8391; --acc: #35d0c0;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg0: #ffffff; --bg1: #f2f5f7; --line: #d6dde3;
          --tx: #1f2328; --dim: #6e7d88; --acc: #0b7c72;
        }
      }
      text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      #h1 { stop-color: var(--bg0); } #h2 { stop-color: var(--bg1); }
      .frame { fill: url(#hbg); stroke: var(--line); }
      .lbl { font-size: 11px; letter-spacing: 1.8px; fill: var(--dim); }
      .val { font-size: 11px; letter-spacing: 1.2px; fill: var(--tx); }
      .acc { fill: var(--acc); }
      .dot { animation: blip 1.8s ease-in-out infinite; fill: var(--acc); }
      @keyframes blip { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
      .b { transform-origin: bottom; animation: eq 1.6s ease-in-out infinite; fill: var(--acc); }
      .b2 { animation-duration: 1.15s; animation-delay: -.35s; opacity: .75; }
      .b3 { animation-duration: 2.05s; animation-delay: -.8s;  opacity: .55; }
      .b4 { animation-duration: 1.45s; animation-delay: -.55s; opacity: .9; }
      @keyframes eq { 0%,100% { transform: scaleY(.25); } 50% { transform: scaleY(1); } }
      .sweep { animation: sw 5.5s linear infinite; fill: var(--acc); }
      @keyframes sw {
        0% { transform: translateX(0); opacity: 0; }
        8% { opacity: .9; } 92% { opacity: .9; }
        100% { transform: translateX(828px); opacity: 0; }
      }
    </style>
  </defs>

  <rect class="frame" width="880" height="64" rx="10"/>

  <circle class="dot" cx="24" cy="32" r="4.5"/>
  <text class="val" x="38" y="36">PIPELINE ACTIVE</text>

  <g transform="translate(196 20)">
    <rect class="b"    x="0"  y="0" width="4" height="24" rx="2"/>
    <rect class="b b2" x="8"  y="0" width="4" height="24" rx="2"/>
    <rect class="b b3" x="16" y="0" width="4" height="24" rx="2"/>
    <rect class="b b4" x="24" y="0" width="4" height="24" rx="2"/>
    <rect class="b b2" x="32" y="0" width="4" height="24" rx="2"/>
  </g>

  <text class="lbl" x="268" y="27">STACK</text>
  <text class="val" x="268" y="45">rust &#183; typescript &#183; bwrap &#183; sandbox-exec</text>

  <text class="lbl" x="596" y="27">POLICY</text>
  <text class="val" x="596" y="45">fail-closed &#183; offline &#183; no keys</text>

  <rect class="sweep" x="26" y="56" width="52" height="2" rx="1"/>
</svg>
