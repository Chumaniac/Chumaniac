<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-label="Chumaniac — capture, compile, verify. Local-first tooling for the agent skill supply chain.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop id="s1" offset="0"/>
      <stop id="s2" offset="1"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop id="r1" offset="0"/>
      <stop id="r2" offset="1" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path class="gridline" d="M26 0H0v26" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="scan"><rect x="0" y="0" width="880" height="300" rx="14"/></clipPath>
    <style>
      :root {
        --bg0: #0a0f14; --bg1: #0d1418; --card: #0f1720; --line: #1c2a33;
        --tx: #e6f1f5; --dim: #6b8391; --acc: #35d0c0; --acc-soft: #35d0c0;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg0: #ffffff; --bg1: #f2f5f7; --card: #f7f9fa; --line: #d6dde3;
          --tx: #1f2328; --dim: #6e7d88; --acc: #0b7c72; --acc-soft: #0b7c72;
        }
      }
      text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      #s1 { stop-color: var(--bg0); } #s2 { stop-color: var(--bg1); }
      #r1 { stop-color: var(--acc); } #r2 { stop-color: var(--acc); }
      .bgrect { fill: url(#bg); }
      .frame { fill: none; stroke: var(--line); }
      .gridline { fill: none; stroke: var(--acc); stroke-opacity: 0.06; }
      .glow { fill: var(--acc); opacity: 0.05; }
      .mark { font-size: 44px; font-weight: 700; letter-spacing: 3.5px; fill: var(--tx); }
      .sub  { font-size: 13px; letter-spacing: 1.2px; fill: var(--dim); }
      .k    { font-size: 11.5px; letter-spacing: 2px; fill: var(--acc); }
      .chip { font-size: 10.5px; letter-spacing: 1.4px; fill: var(--dim); }
      .chipbox { fill: var(--card); stroke: var(--line); }
      .cardbg { fill: var(--card); stroke: var(--line); }
      .titlebar { fill: var(--bg1); }
      .hr { stroke: var(--line); }
      .dot { fill: var(--dim); }
      .t    { font-size: 12.5px; fill: var(--tx); }
      .dim  { fill: var(--dim); }
      .ok   { fill: var(--acc); }
      .p    { fill: var(--acc); }
      .trace { fill: none; stroke: var(--acc-soft); stroke-opacity: 0.28; stroke-width: 1.4;
               stroke-dasharray: 14 190; animation: flow 6s linear infinite; }
      .trace2 { animation-duration: 8.5s; animation-delay: -2.5s; }
      .trace3 { animation-duration: 7.2s; animation-delay: -4s; }
      @keyframes flow { from { stroke-dashoffset: 204; } to { stroke-dashoffset: 0; } }
      .cursor { animation: blink 1.05s steps(1) infinite; fill: var(--acc); }
      @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
      .l1 { animation: rise 9s ease-out infinite; }
      .l2 { animation: rise 9s ease-out infinite; animation-delay: .5s; }
      .l3 { animation: rise 9s ease-out infinite; animation-delay: 2.6s; }
      .l4 { animation: rise 9s ease-out infinite; animation-delay: 3.1s; }
      @keyframes rise { 0%, 2% { opacity: 0; } 8%, 86% { opacity: 1; } 96%, 100% { opacity: 0; } }
      .scanline { animation: sweep 9s linear infinite; }
      @keyframes sweep {
        0% { transform: translateY(-40px); opacity: 0; }
        6% { opacity: .5; } 92% { opacity: .1; }
        100% { transform: translateY(300px); opacity: 0; }
      }
      .node { animation: pulse 3.2s ease-in-out infinite; fill: var(--acc); }
      @keyframes pulse { 0%,100% { opacity: .25; } 50% { opacity: .95; } }
    </style>
  </defs>

  <g clip-path="url(#scan)">
    <rect class="bgrect" width="880" height="300" rx="14"/>
    <rect width="880" height="300" fill="url(#grid)"/>
    <circle class="glow" cx="760" cy="26" r="140" filter="url(#glow)"/>
    <circle class="glow" cx="40" cy="292" r="110" filter="url(#glow)"/>

    <path class="trace" d="M0 40 H96 l16 16 H236"/>
    <path class="trace trace2" d="M880 276 H760 l-18 -18 H640"/>
    <path class="trace trace3" d="M0 282 H120"/>
    <g>
      <circle class="node" cx="236" cy="56" r="2.6"/>
      <circle class="node" cx="640" cy="258" r="2.6" style="animation-delay:-1.1s"/>
      <circle class="node" cx="120" cy="282" r="2.6" style="animation-delay:-2.2s"/>
    </g>

    <text class="k" x="44" y="58">// LOCAL-FIRST &#183; SKILL SUPPLY CHAIN</text>
    <text class="mark" x="44" y="122">CHUMANIAC</text>
    <rect x="44" y="142" width="286" height="1.6" fill="url(#rule)"/>
    <text class="sub" x="44" y="172">capture &#8594; compile &#8594; verify</text>
    <text class="sub" x="44" y="196">provable artifacts for agent skills</text>

    <g>
      <rect class="chipbox" x="44"  y="222" width="72"  height="22" rx="5"/>
      <text class="chip" x="56"  y="237">RUST</text>
      <rect class="chipbox" x="124" y="222" width="130" height="22" rx="5"/>
      <text class="chip" x="136" y="237">TYPESCRIPT</text>
      <rect class="chipbox" x="262" y="222" width="142" height="22" rx="5"/>
      <text class="chip" x="274" y="237">BUBBLEWRAP</text>

      <rect class="chipbox" x="44"  y="252" width="152" height="22" rx="5"/>
      <text class="chip" x="56"  y="267">SANDBOX-EXEC</text>
      <rect class="chipbox" x="204" y="252" width="200" height="22" rx="5"/>
      <text class="chip" x="216" y="267">REPRODUCIBLE BUILDS</text>
    </g>

    <g transform="translate(452 56)">
      <rect class="cardbg" width="390" height="196" rx="10"/>
      <path class="titlebar" d="M0 10a10 10 0 0 1 10-10h370a10 10 0 0 1 10 10v16H0z"/>
      <path class="hr" d="M0 26h390"/>
      <g>
        <circle class="dot" cx="17" cy="13" r="4" opacity="0.5"/>
        <circle class="dot" cx="33" cy="13" r="4" opacity="0.35"/>
        <circle class="dot" cx="49" cy="13" r="4" opacity="0.2"/>
      </g>
      <text class="dim" x="374" y="17" font-size="10.5" letter-spacing="1.2" text-anchor="end">zsh &#8212; skilltape</text>

      <g transform="translate(18 54)">
        <text class="t l1" y="0"><tspan class="p">$</tspan> skilltape verify ./skill</text>
        <text class="t l2" y="24"><tspan class="ok">status:</tspan><tspan dx="6">succeeded</tspan><tspan class="dim" dx="12">sandbox: sandbox-exec</tspan></text>
        <text class="t l3" y="70"><tspan class="p">$</tspan> skillsync verify --target codex</text>
        <text class="t l4" y="94"><tspan class="ok">pass 0</tspan><tspan class="dim"> &#183; warn 2 &#183; fail 0 &#183; unknown 1</tspan></text>
        <text class="t" y="134"><tspan class="p">$</tspan><tspan class="cursor" dx="6">&#9610;</tspan></text>
      </g>
    </g>

    <g class="scanline">
      <rect width="880" height="26" fill="url(#rule)" opacity="0.05"/>
    </g>
    <rect class="frame" x="0.75" y="0.75" width="878.5" height="298.5" rx="13.5"/>
  </g>
</svg>
