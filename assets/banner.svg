<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-label="Chumaniac — capture, compile, verify. Local-first tooling for the agent skill supply chain.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070d"/>
      <stop offset="0.55" stop-color="#0a1120"/>
      <stop offset="1" stop-color="#05100f"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.45" stop-color="#a5b4fc"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0v26" fill="none" stroke="#7dd3fc" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="scan"><rect x="0" y="0" width="880" height="300" rx="14"/></clipPath>
    <style>
      text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .mark { font-size: 44px; font-weight: 700; letter-spacing: 3.5px; fill: url(#mark); }
      .sub  { font-size: 13px; letter-spacing: 1.2px; fill: #8fa3bf; }
      .k    { font-size: 11.5px; letter-spacing: 2px; fill: #38bdf8; }
      .chip { font-size: 10.5px; letter-spacing: 1.4px; fill: #7f93ab; }
      .t    { font-size: 12.5px; fill: #cbe6ff; }
      .dim  { fill: #6f8299; }
      .ok   { fill: #5eead4; }
      .warn { fill: #fbbf24; }
      .p    { fill: #7dd3fc; }
      .bar  { fill: #0d1524; stroke: #233246; }
      .trace { fill: none; stroke: #22d3ee; stroke-opacity: 0.3; stroke-width: 1.4;
               stroke-dasharray: 14 190; animation: flow 6s linear infinite; }
      .trace2 { animation-duration: 8.5s; animation-delay: -2.5s; stroke: #a5b4fc; }
      .trace3 { animation-duration: 7.2s; animation-delay: -4s; stroke: #5eead4; }
      @keyframes flow { from { stroke-dashoffset: 204; } to { stroke-dashoffset: 0; } }
      .cursor { animation: blink 1.05s steps(1) infinite; }
      @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
      .l1 { animation: rise 9s ease-out infinite; }
      .l2 { animation: rise 9s ease-out infinite; animation-delay: .5s; }
      .l3 { animation: rise 9s ease-out infinite; animation-delay: 2.6s; }
      .l4 { animation: rise 9s ease-out infinite; animation-delay: 3.1s; }
      @keyframes rise {
        0%, 2% { opacity: 0; }
        8%, 86% { opacity: 1; }
        96%, 100% { opacity: 0; }
      }
      .scanline { animation: sweep 9s linear infinite; }
      @keyframes sweep {
        0%   { transform: translateY(-40px); opacity: 0; }
        6%   { opacity: .5; }
        92%  { opacity: .1; }
        100% { transform: translateY(300px); opacity: 0; }
      }
      .node { animation: pulse 3.2s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity: .25; } 50% { opacity: .95; } }
    </style>
  </defs>

  <g clip-path="url(#scan)">
    <rect width="880" height="300" rx="14" fill="url(#bg)"/>
    <rect width="880" height="300" fill="url(#grid)"/>
    <circle cx="760" cy="26" r="140" fill="#22d3ee" opacity="0.05" filter="url(#glow)"/>
    <circle cx="40" cy="292" r="110" fill="#a78bfa" opacity="0.05" filter="url(#glow)"/>

    <path class="trace" d="M0 40 H96 l16 16 H236"/>
    <path class="trace trace2" d="M880 276 H760 l-18 -18 H640"/>
    <path class="trace trace3" d="M0 282 H120"/>
    <g fill="#22d3ee">
      <circle class="node" cx="236" cy="56" r="2.6"/>
      <circle class="node" cx="640" cy="258" r="2.6" style="animation-delay:-1.1s"/>
      <circle class="node" cx="120" cy="282" r="2.6" style="animation-delay:-2.2s"/>
    </g>

    <text class="k" x="44" y="58">// LOCAL-FIRST &#183; SKILL SUPPLY CHAIN</text>
    <text class="mark" x="44" y="122">CHUMANIAC</text>
    <rect x="44" y="142" width="286" height="1.6" fill="url(#rule)"/>
    <text class="sub" x="44" y="172">capture &#8594; compile &#8594; verify</text>
    <text class="sub" x="44" y="196">provable artifacts for agent skills</text>

    <g>
      <rect class="bar" x="44"  y="222" width="72"  height="22" rx="5"/>
      <text class="chip" x="56"  y="237">RUST</text>
      <rect class="bar" x="124" y="222" width="130" height="22" rx="5"/>
      <text class="chip" x="136" y="237">TYPESCRIPT</text>
      <rect class="bar" x="262" y="222" width="142" height="22" rx="5"/>
      <text class="chip" x="274" y="237">BUBBLEWRAP</text>

      <rect class="bar" x="44"  y="252" width="152" height="22" rx="5"/>
      <text class="chip" x="56"  y="267">SANDBOX-EXEC</text>
      <rect class="bar" x="204" y="252" width="200" height="22" rx="5"/>
      <text class="chip" x="216" y="267">REPRODUCIBLE BUILDS</text>
    </g>

    <g transform="translate(452 56)">
      <rect width="390" height="196" rx="10" fill="#070c16" fill-opacity="0.96" stroke="#1e2b3d"/>
      <path d="M0 10a10 10 0 0 1 10-10h370a10 10 0 0 1 10 10v16H0z" fill="#0d1524"/>
      <path d="M0 26h390" stroke="#1e2b3d"/>
      <g>
        <circle cx="17" cy="13" r="4" fill="#f2616b"/>
        <circle cx="33" cy="13" r="4" fill="#f0b429"/>
        <circle cx="49" cy="13" r="4" fill="#3ecf8e"/>
      </g>
      <text x="374" y="17" text-anchor="end" font-size="10.5" fill="#4d6076" letter-spacing="1.2">zsh &#8212; skilltape</text>

      <g transform="translate(18 54)">
        <text class="t l1" y="0"><tspan class="p">$</tspan> skilltape verify ./skill</text>
        <text class="t l2" y="24"><tspan class="ok">status:</tspan><tspan dx="6">succeeded</tspan><tspan class="dim" dx="12">sandbox: sandbox-exec</tspan></text>
        <text class="t l3" y="70"><tspan class="p">$</tspan> skillsync verify --target codex</text>
        <text class="t l4" y="94"><tspan class="ok">pass 0</tspan><tspan class="dim"> &#183; </tspan><tspan class="warn">warn 2</tspan><tspan class="dim"> &#183; fail 0 &#183; unknown 1</tspan></text>
        <text class="t" y="134"><tspan class="p">$</tspan><tspan class="cursor" dx="6" fill="#7dd3fc">&#9610;</tspan></text>
      </g>
    </g>

    <g class="scanline">
      <rect width="880" height="26" fill="url(#rule)" opacity="0.05"/>
    </g>
    <rect x="0.75" y="0.75" width="878.5" height="298.5" rx="13.5" fill="none" stroke="#233246"/>
  </g>
</svg>
